# Render Blueprint: one free web service for Socratic AI.
# Render asks for the values marked "sync: false" once, when you create it.
# The keys stay on Render, never in this public repo.
services:
  - type: web
    name: socratic-ai
    runtime: python
    plan: free
    region: singapore              # near the Supabase Asia-Pacific database and the testers
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/concepts
    envVars:
      - key: GOOGLE_API_KEY        # Gemini free key from https://aistudio.google.com/apikey
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SUPABASE_URL          # Supabase > Project Settings > Data API > Project URL
        sync: false
      - key: SUPABASE_SECRET_KEY   # Supabase > Project Settings > API Keys > Secret key (sb_secret_...)
        sync: false
      - key: GOOGLE_CLIENT_ID      # optional Sign in with Google: Google Cloud > Credentials > OAuth client ID (Web). Empty = no button
        sync: false
      - key: AUTH_SECRET           # signs the sign-in cookie; the value is in .env (npx.cmd dotenvx get AUTH_SECRET)
        sync: false
      - key: AI_GUARD             # 1 = AI-style answer check on and paste off in the skill check; 0 = both off
        value: "0"                 # off for testing (21 October 2026). MUST be "1" for the pilot and the study.
